# ==============================================================================
# 1. הגדרות ונתבים (Annotations):
# כפיית HTTPS,
# עיצוב נתיבים ודרישת אימות סיסמה
# (Basic Auth).
# כדי לאכוף גלישה מאובטחת, ולחסום את הגישה לאתר לכל מי שאין לו את שם המשתמש והסיסמה שהגדרת
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: devops-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
# ==============================================================================
# 2. תשתית והצפנה (Class & TLS):
# בחירת מנהל התעבורה
# (NGINX)
# וחיבור תעודת ההצפנה
# (SSL).
# כדי לקבוע שרכיב ה-
# NGINX
# ינתב את התעבורה, ולהפעיל את המנעול הירוק בדפדפן
# (TLS)
# שמונע מצד ג' להאזין לתקשורת.
# ==============================================================================
  ingressClassName: nginx
  tls:
    - secretName: mission-tls
# ==============================================================================
# 3. חוקי ניתוב (Routing Rules):
# הפניית כל הגולשים שנכנסים לכתובת הראשית אל ה-
# Frontend.
# כדי שקוברנטיס יידע לקחת את הבקשה מהאינטרנט ולהעביר אותה פנימה בצורה חלקה לפורט 8080 של שירות
# ה-Frontend.
# ==============================================================================
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 8080