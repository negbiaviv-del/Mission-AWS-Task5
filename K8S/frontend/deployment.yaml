# ==============================================================================
# 1. הגדרות כלליות ושרידות (Metadata & HA):
# פריסת ממשק המשתמש בשני עותקים לזמינות גבוהה.
# כדי שאם פוד אחד יקרוס, העותק השני ימשיך לשרת את הגולשים ללא זמני השתנה
# (Downtime).
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops-app
  labels:
    app: frontend
spec:
  replicas: 2
# ==============================================================================
# 1.5 אסטרטגיית עדכון (Rolling Update) - **התוספת החדשה**
# שומר על זמינות מלאה בזמן עדכון גרסה.
# פוד חדש נדלק ונבדק, ורק כשהוא מוכן ב-100%, הפוד הישן נמחק.
# ==============================================================================
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
# ==============================================================================
# 2. הרשאות פוד (Pod Security & SA):
# ביטול גישה ל-
# API
# של קוברנטיס והרצה כמשתמש מוגבל
# (Non-Root).
# כדי למנוע מהאתר גישה מיותרת למערכת הניהול של קוברנטיס.
# ==============================================================================
      serviceAccountName: frontend-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
# ==============================================================================
# 3. הגדרות קונטיינר (Container Spec):
# משיכת אימג' ה-
# Frontend
# חשיפת הפורט הפנימי (8080).
# כדי להורות לקוברנטיס מאיפה למשוך את הקוד ובאיזה פורט האתר מקבל את התעבורה.
# ==============================================================================
      containers:
      - name: frontend
        image: 544471418394.dkr.ecr.us-east-1.amazonaws.com/mission-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
# ==============================================================================
# 4. בדיקות תקינות (Health Probes):
# ניטור רציף של זמינות עמוד הבית לניתוב תעבורה בטוח.
# כדי שקוברנטיס ידע לבצע ריסטארט אוטומטי לאתר שנתקע
# (Self-Healing),
# וינתב אליו גולשים רק כשהוא באמת מוכן.
# ==============================================================================
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
# ==============================================================================
# 5. הקשחת קונטיינר (Security Context):
# חסימת הסלמת הרשאות וניקוי יכולות מערכת לינוקס.
# כדי לנעול תוקפים בתוך הקונטיינר ללא יכולת לבצע פעולות מנהל
# (Root)
# על השרת המארח.
# ==============================================================================
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
# ==============================================================================
# 6. ניהול משאבים (Resource Limits):
# הגדרת רף מינימום ומקסימום לצריכת מעבד וזיכרון.
# כדי למנוע מהאתר להאט או לקרוס עקב עומס יתר על השרת המארח.
# ==============================================================================
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
