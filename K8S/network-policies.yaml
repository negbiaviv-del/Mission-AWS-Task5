# ==============================================================================
# 1. חסימה מוחלטת (Default Deny):
# נעילת כל התעבורה הנכנסת והיוצאת בסביבת האפליקציה כברירת מחדל.
# אם נתיב לא נפתח במפורש באחד הבלוקים הבאים, הוא חסום.
# ==============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: devops-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

# ==============================================================================
# 2. גישה ל-DNS
# (Allow DNS):
# מתן אישור לפודים לתשאל את שרת השמות של קוברנטיס.
# ללא אישור זה, הפודים לא יוכלו לתרגם שמות לכתובות
# IP
# ושום תקשורת לא תעבוד.
# ==============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: devops-app
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

# ==============================================================================
# 3. גישה ל-Frontend
# (Ingress to Frontend):
# אישור קבלת תעבורה לאתר רק מנתב ה-
# NGINX הראשי.
# ==============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: devops-app
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

# ==============================================================================
# 4. גישה ל-Backend
# (Frontend to Backend):
#  אישור קבלת בקשות ב-
# Backend
# אך ורק מפודי ה-
# Frontend.
# כדי להגן על המנוע של המערכת מפני פודים עוינים שיכולים לנסות לשלוף מידע. 
# ==============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: devops-app
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 5000

# ==============================================================================
# 5. יציאה לענן (Backend/Worker Egress):
# אישור גישה החוצה ל-
# AWS
# (לצורך S3/SQS)
# ולמסד הנתונים.
# ==============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-worker-egress
  namespace: devops-app
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [backend, worker]}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443  # AWS API (S3, SQS, SNS)
        - protocol: TCP
          port: 5432  # PostgreSQL (RDS)