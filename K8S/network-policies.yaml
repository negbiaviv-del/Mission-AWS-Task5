---
# 1. חסימת כל התקשורת כברירת מחדל (Default Deny)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: devops-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# 2. אישור תקשורת ל-DNS של קוברנטיס (חובה כדי שהפודים ימצאו אחד את השני)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: devops-app
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# 3. אישור תקשורת מה-Ingress (העולם החיצון) אל ה-Frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: devops-app
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080

---
# 4. אישור תקשורת מה-Frontend אל ה-Backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: devops-app
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 5000

---
# 5. אישור יציאה מה-Backend וה-Worker ל-AWS (S3/SQS/SNS) ול-RDS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-worker-egress
  namespace: devops-app
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [backend, worker]}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443  # AWS API (S3, SQS, SNS)
        - protocol: TCP
          port: 5432  # PostgreSQL (RDS)
