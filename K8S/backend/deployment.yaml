# ==============================================================================
# 1. הגדרות כלליות ושרידות (Deployment Metadata & HA)
# מה הבלוק עושה: מגדיר את שם הרכיב וקובע שהוא ירוץ בשני עותקים
# (Replicas) במקביל.
# למה צריך את זה: כדי להבטיח זמינות גבוהה
# (High Availability).
# אם פוד אחד נופל, השני ממשיך לשרת לקוחות ללא זמן השבתה
# (Downtime).
# ==============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-app
  labels:
    app: backend
spec:
  replicas: 2
# ==============================================================================
# 1.5 אסטרטגיית עדכון (Rolling Update) - **התוספת החדשה**
# מה הבלוק עושה: מבטיח שתמיד יהיו פודים זמינים בזמן עדכון גרסה.
# פוד חדש יקבל את כל ההרשאות ויעלה לחלוטין לפני שהישן נמחק.
# ==============================================================================
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
# ==============================================================================
# 2. הרשאות ואבטחת הפוד (IRSA & Pod Security Context)
# מה הבלוק עושה: מחבר את הפוד לזהות
# AWS
# ספציפית ומונע ריצה כמשתמש מנהל
# (Root).
# למה צריך את זה: חיבור ה-
# ServiceAccount
# מאפשר לפוד לדבר עם
# S3/SQS
# בצורה מאובטחת. חסימת ה-
# Root
# מגינה על הקלאסטר במקרה של פריצה לקונטיינר.
# ==============================================================================
    spec:
      serviceAccountName: backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

# ==============================================================================
# 3. קונטיינר הכנה (Init Container)
# מה הבלוק עושה: מריץ סקריפט מקדים שמעתיק תעודות אבטחה של מסד הנתונים ומתקן הרשאות.
# למה צריך את זה: מאחר והפוד הראשי מוגבל
# (לא Root),
# קונטיינר ההכנה רץ זמנית עם הרשאות גבוהות כדי להכין את סביבת העבודה
# ספציפית חיבור ה-
# PostgreSQL,
# ואז נעלם. זהו פתרון אבטחה אלגנטי מאוד.
# ==============================================================================
      initContainers:
      - name: init-home
        image: 544471418394.dkr.ecr.us-east-1.amazonaws.com/mission-backend:latest
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        command: ["/bin/sh", "-c"]
        args:
        - >
          mkdir -p /tmp/newhome/.postgresql &&
          cp /home/appuser/.postgresql/* /tmp/newhome/.postgresql/ 2>/dev/null || true &&
          chown -R 1000:1000 /tmp/newhome &&
          chmod 600 /tmp/newhome/.postgresql/* 2>/dev/null || true
        volumeMounts:
        - name: new-home-vol
          mountPath: /tmp/newhome

# ==============================================================================
# 4. הקונטיינר הראשי - אפליקציית ה-
# Backend
# מה הבלוק עושה: מגדיר את השרת עצמו, מושך את האימג', ומקשיח את האבטחה ברמת הקונטיינר.
# ==============================================================================
      containers:
      - name: backend
        image: 544471418394.dkr.ecr.us-east-1.amazonaws.com/mission-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
# ==============================================================================
# 5. הזרקת סודות ומשתני סביבה (Environment Variables & Secrets)
# מה הבלוק עושה: טוען נתונים מקובץ ה-
# ConfigMap
# ומושך סיסמאות מה-
# Secrets
# של קוברנטיס.
# למה צריך את זה: מפריד את הקוד מההגדרות
# (פרקטיקת 12-Factor App)
# ושומר על סיסמאות מסד הנתונים מוסתרות ומאובטחות.
# ==============================================================================
        env:
        - name: HOME
          value: "/tmp/newhome"
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: db-app-secrets
        - secretRef:
            name: flask-secret

# ==============================================================================
# 6. ניהול משאבים (Resource Requests & Limits)
# מה הבלוק עושה: מגדיר כמה זיכרון ו-
# CPU
# הפוד רשאי לצרוך לכל הפחות ולכל היותר.
# למה צריך את זה: מונע מצב שבו פוד אחד "משתגע", צורך את כל משאבי השרת הפיזי
# (Node)
# ומפיל פודים אחרים שרצים לידו.
# ==============================================================================
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        volumeMounts:
        - name: new-home-vol
          mountPath: /tmp/newhome

# ==============================================================================
# 7. בדיקות תקינות (Health Probes)
# מה הבלוק עושה: דוגם את הנתיב
# '/health'
# באפליקציה כדי לדעת אם היא עובדת.
# למה צריך את זה:
# Readiness: מוודא שלא תישלח תעבורת משתמשים לפוד שעדיין עולה או מעבד נתונים.
# Liveness: אם השרת נתקע, קוברנטיס יזהה זאת ויבצע ריסטארט אוטומטי לפוד
# (Self-Healing).
# ==============================================================================
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 15

# ==============================================================================
# 8. הגדרת נפחי אחסון זמניים (Volumes)
# מה הבלוק עושה: מגדיר שטח אחסון זמני
# (emptyDir)
# שנוצר ונמחק יחד עם הפוד.
# למה צריך את זה: מאפשר שיתוף קבצים מאובטח בין קונטיינר ההכנה - שהעתיק את ההרשאות לקונטיינר הראשי שניגש אליהן בסעיף 4.
# ==============================================================================
      volumes:
      - name: new-home-vol
        emptyDir: {}
