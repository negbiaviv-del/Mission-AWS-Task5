apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: devops-app
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 5000  # הפורט שזה Service קלאסטר
      targetPort: 5000  # הפורט שבו הפוד עצמו מאזין