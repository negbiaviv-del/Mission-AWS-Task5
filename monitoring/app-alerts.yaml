# ==============================================================================
# 1. הגדרות וקישוריות (Metadata & Labels):
# שיוך חוקי ההתראות למערכת ה-
#Prometheus המרכזית.
# ==============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-app-alerts
  namespace: observability
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
  - name: application-alerts
    rules:
# ==============================================================================
# 2. התראות אפליקציה (Flask Backend):
# זיהוי זינוק בשגיאות שרת
# (5xx)
# ואיטיות בתגובות
# (Latency).
# ==============================================================================
    - alert: HighErrorRate
      expr: |
        sum(rate(flask_http_request_total{status=~"5.."}[5m]))
        /
        sum(rate(flask_http_request_total[5m])) > 0.1
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "High 5xx error rate detected on application"
        description: "The application is returning 5xx errors for more than 10% of requests over the last 5 minutes."
        runbook_url: "https://github.com/negbiaviv-del/Mission-AWS-Task5/wiki/Runbook-HighErrorRate"

    - alert: HighLatencyP95
      expr: histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket[5m])) by (le)) > 2.0
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "High P95 Latency"
        description: "95th percentile latency is above 2 seconds."
        runbook_url: "https://github.com/negbiaviv-del/Mission-AWS-Task5/wiki/Runbook-HighLatency"

# ==============================================================================
# 3. התראות תהליכי אוטומציה (Jenkins):
# התראה על צינורות בנייה
# (Pipelines)
# שנתקעו בתור.
# ==============================================================================
    - alert: JenkinsQueueStuck
      expr: jenkins_queue_size_value > 0
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "Jenkins Queue is Stuck"
        description: "There are builds waiting in the Jenkins queue for more than 1 minute. Check if agents are online."
        runbook_url: "https://github.com/negbiaviv-del/Mission-AWS-Task5/wiki/Runbook#jenkins-queue-stuck"

# ==============================================================================
# 4. התראות תשתית (Kubernetes):
# זיהוי פודים שקרסו ושרתים פיזיים
# (Nodes)
# מנותקים.
# ==============================================================================
    - alert: ReplicasMismatch
      expr: kube_deployment_spec_replicas{namespace="devops-app"} != kube_deployment_status_replicas_available{namespace="devops-app"}
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Deployment Replicas Mismatch"
        description: "Available replicas are less than desired replicas in devops-app namespace."
        runbook_url: "https://github.com/negbiaviv-del/Mission-AWS-Task5/wiki/Runbook-ReplicasMismatch"

    - alert: NodeNotReady
      expr: kube_node_status_condition{condition="Ready",status="true"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Kubernetes Node Not Ready"
        description: "A node has been in a NotReady state for more than 2 minutes."
        runbook_url: "https://github.com/negbiaviv-del/Mission-AWS-Task5/wiki/Runbook-NodeNotReady"

# ==============================================================================
# 5. התראות מערכת הניטור (Prometheus):
#  זיהוי מקרים בהם יעד הניטור עצמו נפל ולא משדר נתונים.
# ==============================================================================
    - alert: PrometheusTargetDown
      expr: up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Prometheus Target Down"
        description: "A Prometheus target has disappeared. An exporter might be down."
        runbook_url: "https://github.com/negbiaviv-del/Mission-AWS-Task5/wiki/Runbook-TargetDown"

# ==============================================================================
# 6. התראות ניתוב וקריסות (Ingress & Pods):
# זיהוי שגיאות ברמת השירות ואיתור פודים ספציפיים שקורסים.
# ==============================================================================
    # --- Ingress Alerts ---
    - alert: IngressHighErrorRate
      expr: |
        sum(rate(nginx_ingress_controller_requests{status=~"5.."}[5m])) by (ingress, service)
        /
        sum(rate(nginx_ingress_controller_requests[5m])) by (ingress, service) > 0.05
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "High 5xx Error Rate on {{ $labels.service }}"
        description: "Service {{ $labels.service }} under Ingress {{ $labels.ingress }} is returning too many 5xx errors."
        runbook_url: "https://github.com/negbiaviv-del/Mission-AWS-Task5/wiki/Runbook-IngressErrors"

    # --- Specific Pod Alerts ---
    - alert: PodCrashing
      expr: rate(kube_pod_container_status_restarts_total[5m]) * 300 > 2
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} is crashing in loop"
        description: "הפוד {{ $labels.pod }} בסביבת {{ $labels.namespace }} ביצע מספר ריסטארטים ב-5 הדקות האחרונות. כנראה שהקונטיינר נופל מיד בעלייה."
        runbook_url: "https://github.com/negbiaviv-del/Mission-AWS-Task5/wiki/Runbook-PodCrashing"