# ==============================================================================
# 1. מנוע פרומתיאוס (Prometheus):
# הגדרת אגירת נתונים, שאיבה דינמית
# (ServiceMonitors)
# ומשאבים.
# ==============================================================================
prometheus:
  prometheusSpec:
    # שמירת נתונים ל-15 ימים
    retention: 15d

    # הגדרת אסטרטגיית איסוף - חשוב מאוד! מאפשר ל-Prometheus לאסוף כל ServiceMonitor שנגדיר
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # הגדרת נפח אחסון קבוע (PVC) - דרישת חובה
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # הגבלת משאבים (Requests/Limits)
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

# ==============================================================================
# 2. ממשק גרפנה (Grafana):
#  חשיפה לרשת
# (LoadBalancer),
#  טעינת דאשבורדים
# (Sidecar)
# ושמירת מידע.
# ==============================================================================
grafana:
  # הגדרת חשיפה אוטומטית החוצה ללא צורך ב-Port Forward
  service:
    type: LoadBalancer

  # חובה: הגדרת Sidecar לטעינה אוטומטית של Dashboards מתוך הקוד (GitOps)
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  # הגדרת אחסון קבוע לגרפנה
  persistence:
    enabled: true
    storageClassName: gp2
    size: 5Gi

# ==============================================================================
# 3. מנהל ההתראות (Alertmanager):
# ניתוב התראות ל-SNS ואחסון היסטוריית מצבים.
# ==============================================================================
alertmanager:
  enabled: true

  serviceAccount:
    create: true
    name: "alertmanager-sa"
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::544471418394:role/alertmanager-irsa-role"

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'aws-sns-alerts'

    receivers:
    # מחזירים את נמען ה-null כדי שפרומתיאוס יוכל לזרוק אליו התראות פנימיות
    - name: 'null'
    - name: 'aws-sns-alerts'
      sns_configs:
      - topic_arn: "arn:aws:sns:us-east-1:544471418394:aviv-project-alerts-v2"
        sigv4:
          region: "us-east-1"
        subject: "[{{ .Status | toUpper }}] Prometheus Alert: {{ .GroupLabels.alertname }}"
        message: |
          Alert: {{ .GroupLabels.alertname }}
          Description: {{ .CommonAnnotations.description }}
          Status: {{ .Status }}

  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# הוסף את השורות האלו בסוף או בהתחלה של הקובץ prometheus-values.yaml
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false
