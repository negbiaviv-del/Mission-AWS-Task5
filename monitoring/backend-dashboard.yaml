---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"  # ה-Label שה-Sidecar מחפש!
data:
  backend-metrics.json: |-
    {
      "title": "Application Backend Metrics",
      "tags": ["backend", "app"],
      "timezone": "browser",
      "panels": [
        {
          "title": "Requests Per Second (RPS)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"backend-service\"}[5m]))",
              "legendFormat": "RPS"
            }
          ]
        },
        {
          "title": "Error Rate (5xx/4xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{job=\"backend-service\", status=~\"[45]..\"}[5m]))",
              "legendFormat": "Errors"
            }
          ]
        },
        {
          "title": "Average Latency (Seconds)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_sum{job=\"backend-service\"}[5m])) / sum(rate(http_request_duration_seconds_count{job=\"backend-service\"}[5m]))",
              "legendFormat": "Latency"
            }
          ]
        }
      ]
    }
