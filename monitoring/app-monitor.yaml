# ==============================================================================
# 1. הגדרות וקישוריות (Metadata & Labels):
# שיוך הגשש למערכת ה-
# Prometheus המרכזית.
# ==============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
# ==============================================================================
# 2. איתור השירות (Selectors):
# הגדרת יעד הניטור
# (שירות ה-Backend בסביבת devops-app).
# ==============================================================================
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
      - devops-app
# ==============================================================================
# 3. הגדרות דגימה (Endpoints):
#  קביעת הנתיב
# (/metrics)
#  ותדירות איסוף הנתונים כל 15 שניות.
# ==============================================================================
  endpoints:
    - port: http
      path: /metrics
      interval: 15s