apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: backend # שנה את זה אם התווית של ה-Service שלך שונה
  namespaceSelector:
    matchNames:
      - devops-app # ה-Namespace שבו רצה האפליקציה שלך
  endpoints:
    - port: http # חשוב: זה חייב להיות *השם* של הפורט כפי שמוגדר ב-Service של הבקאנד
      path: /metrics
      interval: 15s