# ==============================================================================
# 1. הגדרות (Metadata):
# הגדרת חוקי רשת עבור סביבת הניטור.
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-traffic-policy
  namespace: observability
spec:
# ==============================================================================
# 2. תחולת החוק (Pod Selector & Policy Types):
# החלת החוק על כלל הפודים בסביבה עבור תעבורה נכנסת.
# ==============================================================================
  podSelector: {} # החוק יחול על כל הפודים בתוך observability
  policyTypes:
    - Ingress
  ingress:
# ==============================================================================
# 3. תקשורת פנימית (Internal Traffic):
# אישור לפודי הניטור לדבר אחד עם השני באופן חופשי.
# ==============================================================================
    # 1. היתר לתקשורת פנימית בתוך ה-Namespace
    - from:
        - podSelector: {}
# ==============================================================================
# 4. גישה חיצונית (External Access):
# פתיחת פורטים ספציפיים לצפייה בדאשבורדים ודיבוג.
# ==============================================================================
    # 2. היתר לגישה חיצונית
    # (עבור ה-LoadBalancer
    #  של גרפנה)
    - ports:
        - port: 3000
          protocol: TCP
        - port: 9090 # פורט ברירת מחדל של פרומתיאוס למקרה של דיבוג
        - port: 9093 # פורט של Alertmanager