# ==============================================================================
# נתב התנועה (Reverse Proxy):
# מנתב את הבקשות הנכנסות מפורט 8080 פנימה ל-
# Backend
# ==============================================================================
server {
    listen 8080;

    location / {
        proxy_pass http://backend-service:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}