# ==============================================================================
# 1. יצירת חשבון שירות (ServiceAccount)
# מה הבלוק עושה: מייצר "תעודת זהות" וירטואלית עבור ג'נקינס בתוך קוברנטיס.
# למה צריך את זה: כדי שהשרת של ג'נקינס
# (או ה-Agents שלו)
# לא יזדהו כאנונימיים, אלא כמשתמש מוכר ומוגדר מראש במערכת.
# ==============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-admin
  namespace: jenkins

# ==============================================================================
# 2. הגדרת תפקיד והרשאות נרחבות (ClusterRole)
# מה הבלוק עושה: מגדיר רשימה מפורטת של פעולות
# (Verbs)
# ומשאבים
# (Resources)
#  שמותר לבצע בקלאסטר.
# למה צריך את זה: ג'נקינס אחראי על פריסת האפליקציה
# (CD).
# הבלוק הזה מעניק לו את הכוח ליצור, למחוק ולעדכן פודים, סודות, רשתות והגדרות בכל ה-
# Namespaces השונים.
# ==============================================================================
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-admin
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "secrets", "configmaps", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]

# ==============================================================================
# 3. קישור ההרשאות לחשבון (ClusterRoleBinding)
# מה הבלוק עושה: מחבר בין תעודת הזהות
# (ServiceAccount)
#  לבין התפקיד
# (ClusterRole).
# למה צריך את זה: יצירת משתמש ויצירת רשימת הרשאות לא שוות כלום ללא ה"שידוך" ביניהן. הבלוק הזה מעניק בפועל את הכוח שהוגדר למשתמש של ג'נקינס.
# ==============================================================================
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jenkins-admin
subjects:
  - kind: ServiceAccount
    name: jenkins-admin
    namespace: jenkins