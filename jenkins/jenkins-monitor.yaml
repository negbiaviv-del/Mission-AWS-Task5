# ==============================================================================
# ServiceMonitor:
# חיבור אוטומטי של ג'נקינס למערכת הניטור
# (Prometheus)
# מה הבלוק עושה: מורה לפרומיתיאוס לשאוב מדדים מג'נקינס כל 30 שניות.
# למה צריך את זה: ללא קובץ זה, פרומיתיאוס לא יידע שג'נקינס קיים, ולא יוצגו נתונים בגרפאנה.
# ==============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jenkins-monitor
  namespace: observability
  labels:
    # תגית חובה כדי שפרומיתיאוס יזהה ויאסוף את הקובץ הזה
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: jenkins
      app.kubernetes.io/name: jenkins
  namespaceSelector:
    matchNames:
      - jenkins
  endpoints:
    - port: http
      path: /prometheus/
      interval: 30s